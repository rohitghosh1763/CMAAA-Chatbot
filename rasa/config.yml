language: en

pipeline:
    - name: WhitespaceTokenizer
    - name: RegexFeaturizer
    - name: LexicalSyntacticFeaturizer
    - name: CountVectorsFeaturizer
    - name: CountVectorsFeaturizer
      analyzer: char_wb
      min_ngram: 1
      max_ngram: 4
    - name: DIETClassifier
      epochs: 100
    - name: EntitySynonymMapper
    - name: ResponseSelector
      epochs: 100
    - name: FallbackClassifier
      threshold: 0.4
      ambiguity_threshold: 0.1

policies:
    # First policy handles the conversation patterns from stories
    - name: MemoizationPolicy
      max_history: 5

    # Machine learning policy for complex conversations
    - name: TEDPolicy
      max_history: 5
      epochs: 100

    # Rule-based policy with fallback configuration
    - name: RulePolicy
      core_fallback_threshold: 0.3
      core_fallback_action_name: "action_default_fallback"
      enable_fallback_prediction: false
